# quota-axi declarative policy (captain/agent-editable).
#
# The account-switch decider (a separate later ticket) applies a fixed
# precedence over this policy and the account registry. Complex strategies are
# authored by rewriting this file; quota-axi only validates and hot-reloads it.
# The last valid policy is always retained as the mechanical fallback.
#
# Ordering is meaningful: earlier tiers, and earlier pools within a tier, are
# preferred. Every account id referenced here must exist in accounts.yaml.
#
# The Phase 2 model map (per-provider model equivalents plus a required default
# model per provider) slots in later as an additive `model_map` field without
# breaking this schema. It is intentionally absent in Phase 1.
schema_version: 1

# Policy-level reserve floors the decider must respect across all pools,
# keyed by quota window id. Percent of the window that must remain unused.
captain_reserve:
  seven_day: 5

tiers:
  - name: fixed-cost-first
    pools:
      - accounts: [claude-max-primary, claude-pro-personal]
        min_reserve:
          five_hour: 5

  - name: metered-fallback
    pools:
      - accounts: [claude-team-seat-a]

# Priming gates keep a cooled-down account out of selection until the named
# window recovers to the given remaining-percent threshold.
priming:
  - window: seven_day
    resume_at_percent_remaining: 20
    accounts: [claude-max-primary]

# Strategy-gated priming pass (ADR 0031, Phase 2). Priming keeps fixed-cost
# accounts primed: auth verified and telemetry fresh within one window cycle.
# It ONLY verifies auth and freshens telemetry; it never advances or resets any
# provider reset clock.
#
# `enabled` is the master gate: with priming off (or this block absent) there is
# ZERO synthetic traffic. When on, `prefer_real_work` (default true) routes real
# work to under-used fixed-cost accounts first, so the minimal read-only
# synthetic ping is the last resort, issued only when the fleet is idle.
# `max_telemetry_age_seconds` is the staleness threshold and synthetic-ping
# cadence; it defaults to the shortest window cycle (5h = 18000s) so telemetry
# never goes stale.
priming_strategy:
  enabled: true
  prefer_real_work: true
  max_telemetry_age_seconds: 18000
